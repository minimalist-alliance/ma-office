# Spring AOT fixes bean wiring at build time, so nothing here may decide which beans exist at runtime.
spring.main.web-application-type=none
spring.main.banner-mode=off
# The only startup line is ReadinessReporter's.
spring.main.log-startup-info=false
# Lazy init would move the cost onto the first user call.
spring.main.lazy-initialization=false
# Virtual threads are daemons, so without this the JVM could exit with work still running.
spring.main.keep-alive=true
spring.threads.virtual.enabled=true
spring.jmx.enabled=false

spring.output.ansi.enabled=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level %logger{0} %msg%n

# Filled in by Maven resource filtering.
deskd.version=@project.version@
