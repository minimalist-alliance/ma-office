# A self-hosted desk (selfhost/install.sh): public time servers in place of the cloud's. The platform refuses a desk's
# signed requests more than 5 minutes off.
pool 2.debian.pool.ntp.org iburst
driftfile /var/lib/chrony/chrony.drift
# Step the clock if it is off by more than 1 s, at any time (resume, stop/start)
makestep 1.0 -1
rtcsync
# Never act as a server; command socket stays on loopback
port 0
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
leapsectz right/UTC
logdir /var/log/chrony
