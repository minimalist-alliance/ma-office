# A self-hosted desk: once desk-rtc listens (it loads or makes its DTLS identity first), root copies that identity's
# fingerprint to where ma-selfhost reads it, and ma-selfhost signs it with the desk's key: the platform takes a hello
# only with a fingerprint the key signed (selfhost/README.md, "Pairing and identity"). "-": desk-rtc runs either way.
[Service]
ExecStartPost=-+/usr/local/lib/ma/selfhost/ma-selfhost-dtls --wait
