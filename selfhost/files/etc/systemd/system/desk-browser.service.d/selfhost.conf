# A self-hosted desk: the Browser starts once ma-selfhost-net has filled the firewall's list of the desk's own networks
# (EXP-9), which it can't reach. Wants, not Requires: if the helper is broken the Browser still starts, with IPv4 held to
# the ranges and home4's last list, and no IPv6 beyond loopback (nftables.conf's ipv6_ok).
[Unit]
Wants=ma-selfhost-net.service
After=ma-selfhost-net.service
