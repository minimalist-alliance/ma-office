# cloud-init off after a desk's first boot (TD-227, image/README.md "Faster wakes").
# cloud-init does its work on a desk's first boot: the network file, host name, users, a growing root. On every later boot it
# only asks the metadata service whether anything changed, and it stands in front of the network: cloud-init-local is
# network-pre.target, and cloud-init-network is before sysinit.target, so Docker, containerd and everything after them waited
# for it and for DHCP, about 4 s of every wake on a t4g.medium (docs/benchmarks/2026-11-alliance-desk.md). So once the final
# stage has finished, this writes /etc/cloud/cloud-init.disabled, which cloud-init's generator reads next boot and enables none
# of its units.
# ExecStartPost runs only if cloud-final's ExecStart succeeded, so a first boot where cloud-init failed leaves it on and the next
# boot runs it again. The marker is on the root: a root replacement (a new image on the same instance) brings an image without
# it, cloud-init runs as on a first boot, and this writes it again. The image never has the marker (build.sh checks).
# A drop-in on cloud-final, not a unit of ours: cloud-final is After=multi-user.target, so a unit wanted by multi-user.target
# and ordered after it is an ordering cycle (found the first time, on the test desk).
[Service]
ExecStartPost=/bin/sh -c '[ -e /etc/netplan/50-cloud-init.yaml ] && touch /etc/cloud/cloud-init.disabled'
