# Amazon Time Sync Service (link-local, no internet needed)
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4
driftfile /var/lib/chrony/chrony.drift
# Step the clock if it is off by more than 1 s, at any time (resume, stop/start)
makestep 1.0 -1
rtcsync
# Never act as a server; command socket stays on loopback
port 0
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
leapsectz right/UTC
logdir /var/log/chrony
