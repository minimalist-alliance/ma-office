# Kernel hardening for a desk of its own, the same lines the shared host sets (image/host/, ADR 0072; desk-host-check) less its
# forwarding and port-range lines. verify.sh section 3s reads each value.
# ISS-20: some key Strings in deskd and desk-agent can't be zeroed, which is acceptable only while no other process of the
# same uid can read their memory. Only a process with CAP_SYS_PTRACE (root) may attach to another; nothing on a desk does.
kernel.yama.ptrace_scope = 2
# No tty line discipline autoloaded by TIOCSETD (the modules are blacklisted too)
dev.tty.ldisc_autoload = 0
# No core files of the desk's processes: a core of deskd or desk-agent would hold keys
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0
kernel.unprivileged_bpf_disabled = 1
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
