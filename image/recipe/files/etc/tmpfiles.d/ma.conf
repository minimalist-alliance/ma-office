d /run/desk 0770 rtc desk -
d /run/desk-media 0750 rtc stream -
# desk-agent's sockets. Group desk through the setgid bit, so deskd can reach agent.sock without agent being in group
# desk, which would open rtc.sock to it.
d /run/desk-agent 2750 agent desk -
# desk-notebook's socket, the same way: deskd reaches notebook.sock by group desk, and notebook stays out of that group.
d /run/desk-notebook 2750 notebook desk -
d /tmp/.X11-unix 1777 root root -
d /opt/ma 0755 root root -
d /opt/ma/bin 0755 root root -
