# Courier's mail reader (ADR 0097's sandbox for deskd; docs/sub-status/mm-courier-parse.md). deskd (uid 1100, group desk) enters
# /run/desk-parse-courier and its sock by group; desk-svc, as parse (1113) in the sandbox, binds parse.sock in sock at 0660, its
# group desk by the setgid bit, and serves uid 1100 only. No `required` marker: deskd has no reader of its own to fence off, and
# no socket means mail waits as pending. The sandbox mounts sock only. Installed as /etc/tmpfiles.d/desk-parse-courier.conf.
d /run/desk-parse-courier 0750 root desk -
d /run/desk-parse-courier/sock 2750 parse desk -
