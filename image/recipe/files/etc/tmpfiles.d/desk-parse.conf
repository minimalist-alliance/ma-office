# The Agent's attachment reader (ADR 0097 section 2). desk-agent (uid 1103, group agent) enters /run/desk-parse and
# /run/desk-parse/sock by group; desk-svc, as parse (1113) in the sandbox, binds parse.sock in sock at 0660, its group agent
# by the setgid bit, and serves uid 1103 only. required is the marker: with it, desk-agent never reads a file in its own
# child, and a broken sidecar means "unavailable". The sandbox mounts sock only, so it can't touch the marker.
# Installed as /etc/tmpfiles.d/desk-parse.conf.
d /run/desk-parse 0750 root agent -
f /run/desk-parse/required 0444 root root - 1
d /run/desk-parse/sock 2750 parse agent -
