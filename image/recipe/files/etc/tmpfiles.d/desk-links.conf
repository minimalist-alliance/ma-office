# Where the xdg-open stand-in (as kiosk, Chromium's user) hands deskd (as desk) the links Chromium gives the OS
# (desk-runtime.md section 8.11). deskd makes links.sock in it at 0660; the setgid bit gives the socket the group kiosk,
# so kiosk can connect and no other user can enter. deskd also checks each peer's uid.
# Installed as /etc/tmpfiles.d/desk-links.conf.
d /run/desk-links 2750 desk kiosk -
