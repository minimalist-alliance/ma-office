# Each start and reload of nftables.service loads nftables.conf, whose "flush ruleset" takes away the Guild Desk's voice
# rule, so the rule goes back straight after (image/README.md, "Guild Desk"). On a member's desk the test fails and nothing
# runs: no flag, no rule, and the ruleset is exactly nftables.conf's. At boot this runs before desk-kind has answered, so
# there's no flag yet then; desk-guild-net.service puts the rule in once there is. "-": the rule never fails the firewall.
[Service]
ExecStartPost=-/bin/sh -c '[ ! -e /run/ma/guild ] || exec /usr/local/lib/ma/desk-guild-net'
ExecReload=-/bin/sh -c '[ ! -e /run/ma/guild ] || exec /usr/local/lib/ma/desk-guild-net'
