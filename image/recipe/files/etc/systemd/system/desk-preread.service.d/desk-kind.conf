# A Guild Desk has no Browser (image/README.md, "Guild Desk"): this unit only serves the Browser, so it's skipped there.
# desk-kind.service writes /run/ma/guild at boot, before deskd, and only for an exact DeskKind=guild. Without the file
# (a member's desk, or any read that went wrong) this condition holds and nothing changes. desk-units refuses deskd's
# Browser verbs on a Guild Desk with "err unsupported", so this is the second wall, for any other start.
# A drop-in, so the unit file itself stays as its owner wrote it.
[Unit]
ConditionPathExists=!/run/ma/guild
