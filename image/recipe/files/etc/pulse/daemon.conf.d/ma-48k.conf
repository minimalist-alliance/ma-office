# The desk's sound is 48 kHz end to end (Opus, WebRTC). Pin the server so nothing can move its null sink to 44.1 kHz:
# PulseAudio falls back to its default rate when a sink resumes from a suspend, and then the sink and its monitor can
# disagree (desk-stream 0.3.1 lost about 8% of its sound on such a sink). The null sink's own rate=48000 is on the
# module line in desk-audio.service; this is the server's default for everything else.
default-sample-rate = 48000
alternate-sample-rate = 48000
