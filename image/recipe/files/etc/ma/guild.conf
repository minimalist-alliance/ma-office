# A Guild Desk's sizes (image/README.md, "Guild Desk"). Read only on a Guild Desk (/run/ma/guild), by desk-egress, for the
# voice class, desk-rtc's class and the Guild Desk's budget. Nothing reads it on a member's desk. Root only. The image's file: a release doesn't touch it. GB is 10^9 bytes, as desk-egress counts.
[tiers]
# The most members each instance type holds (ADR 0080, Platform's guild_desk#current), read from the instance type the
# hypervisor reports (/sys/devices/virtual/dmi/id/product_name). Any other type is sized as default, the largest tier:
# a voice ceiling that's too low cuts every member's voice, a cost line that's too loose still has Platform's stops.
t4g.small = 25
t4g.medium = 50
c7g.xlarge = 200
default = 200

[egress]
# Voice, class 1:30: Commons' UDP from its voice ports, and the RTP desk-rtc relays from UDP 443. A member hears at most
# 10 voices, 60.8 kb/s each on the wire (apps/commons/README.md, load test), 0.61 Mbit a member; 0.8 leaves 30% for
# bursts and RTCP. 20, 40 and 160 Mbit at 25, 50 and 200 members.
voice_mbps_per_member = 0.8
# desk-rtc's class, 1:10: every member's data channels, and the voice it relays over ICE-TCP. On a member's desk it's
# 60 Mbit with a FIFO for one member's video; here it's 0.75 Mbit a member, never under that 60, with fq_codel. The
# guild's burst profile (desk-rtc/README.md: a tenth of the sessions moving 1 MiB each way every 5 s) is about 0.5 Mbit a
# member down, and that FIFO stalled every member's data behind it (docs/sub-status/desk-net-031.md); 0.75 leaves half
# again. 60, 60 and 150 Mbit at 25, 50 and 200 members.
rtc_mbps_per_member = 0.75
# The guild's day line, on all the desk's outbound in any 24 h: in practice voice and desk-rtc's class, which members'
# meters count, since the rest stays under the 30 GB bucket egress.conf sets on every desk. ADR 0080's worst hour is 312 MB a member (the whole guild in one room, 10 voices heard, nobody pausing); 4 GB is 12.8
# of those for every member in a day: 100, 200 and 800 GB, before the cap below. Past it, until under the release line,
# voice drops to 3 voices heard a member (0.2 Mbit) and desk-rtc's class to 0.1 Mbit a member. It's a line, not a stop.
day_gb_per_member = 4
day_release_gb_per_member = 3.5
# TEMPORARY CAP (Security's NET031-1, 2026-11-08), until Platform's cost guard has a Guild Desk's own limits. The guard
# stops any instance past 150 GB in any 24 h, and the lines above are 200 and 800 GB on a 50- and a 200-member Guild
# Desk, so a busy guild got the whole desk stopped before its own line slowed anything. Until then every tier's line is
# at most 120 GB and its release line at most 105: 100, 120 and 120 GB (release 87.5, 105, 105) at 25, 50 and 200
# members. If these are missing or bad, desk-egress caps at 120 and 105 anyway. To lift the cap once the guard knows
# Guild Desks, set both to 0 (docs/sub-status/desk-net-031-sec.md).
day_cap_gb = 120
day_release_cap_gb = 105
guarded_voice_mbps_per_member = 0.2
guarded_rtc_mbps_per_member = 0.1
