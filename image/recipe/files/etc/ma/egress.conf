# desk-egress's budgets (ADR 0036 section 5). GB is 10^9 bytes, as the guard counts. A missing value is desk-egress's default,
# which is this file's value. Root only. A test lowers these and restarts the unit; a release doesn't touch this file.
[egress]
interface = ens5
tick_seconds = 60
# Each class's rate and ceiling. They hold whatever desk-egress does.
stream_mbps = 60
root_mbps = 2
other_mbps = 100
# Layer 2: the bucket on 1:15 and 1:20. When it's empty those two classes slow down, and they reopen with reopen_gb back.
bucket_gb = 30
refill_mbps = 1
reopen_gb = 1
slowed_root_mbps = 0.25
slowed_other_mbps = 0.75
# Layers 3 and 4: the stream's profile, on all outbound this UTC month and in the last 24 h.
capped_month_gb = 100
capped_day_gb = 100
deep_month_gb = 500
deep_day_gb = 120
deep_day_release_gb = 100
# Layer 5: desk-rtc's class, for a broken desk-rtc. Two honest viewers peak at 133 GB in 24 h.
clamp_day_gb = 135
clamp_day_release_gb = 120
clamped_stream_mbps = 1
