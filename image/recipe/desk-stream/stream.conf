# Default for desk-stream 0.3.0 onward (ADR 0073). Measured in spikes/desk-stream-damage/README.md.
# 0.3.0: deskcap captures only what changed (XDamage), converts only that to NV12, and sends a frame only when the screen
#   changed, a keyframe was asked for, or a heartbeat is due (a repeat, at least once a second on a still screen, so a
#   browser neither counts a freeze nor asks for a keyframe). It replaces ximagesrc at a fixed 60 fps and yuvconv's
#   duplicate dropping, whose 500 ms of full rate after every change kept a page with a ticking clock at 60 encodes a second.
#   [adapt] is lever 3: under contention the stream lowers its resolution, then its quality, and only then caps at 30 fps.
# 0.2.1 to 0.2.4 (docs/benchmarks/2026-11-real-stack.md), still true here:
#   - Rate control: constant quality (quantizer 23) capped at 8 Mbps with a 150 ms VBV, instead of 8 Mbps CBR. Real 1080p60 footage drops
#     from 3.5 to 1.3-3.2 GB/h (BBB clip) and scrolling from 3.3 to 1.8-2.5 GB/h. CPU while scrolling drops 11 points on t4g.medium (1080p) and 2 on c7g.large.
# What it does NOT do: change the X screen's size (1920x1080, fixed by the image: xorg-dummy.conf, desk-browser-start).
# Capped profile for the 100 GB allowance: quantizer=28 bitrate=4000 vbv-maxrate=4000 vbv-bufsize=600 (spikes/browser-bench/real-stack/conf/adr33-capped.conf).
# Encoder settings for desk-stream, and the only place they live (desk-runtime.md section 8.2).
# Change a value and ship a desk-stream release: no code change, no new AMI.
# deskcap and framemeter are in gst-plugins/ next to this file (src/deskcap.c). yuvconv, which the image has, still works in
# a conf that names it: capture = ximagesrc ..., convert = yuvconv ... as in 0.2.4.

[video]
# 1920x1080@60. The size is the X screen's. The pointer is never captured: the client draws it (B12).
# deskcap: max-fps is the most frames a second (the contention control may lower it to 30, never further), and
# heartbeat-max-ms the longest a still screen goes without a repeat. Its NV12 is BT.601 limited range, as yuvconv's was.
capture = deskcap display-name=:99 max-fps=60 heartbeat-max-ms=1000 ! video/x-raw,format=NV12
# If deskcap won't load (another architecture, an older GStreamer), these run instead: 0.2.4's capture, at 0.2.4's cost.
fallback-capture = ximagesrc display-name=:99 show-pointer=false use-damage=false ! video/x-raw,framerate=60/1
fallback-convert = yuvconv drop-duplicates=true heartbeat-ms=100 keyframe-ms=4000 active-ms=500 log-every=0 ! video/x-raw,format=NV12
x264 = threads=2 pass=qual quantizer=23 bitrate=8000 vbv-buf-capacity=150 option-string=vbv-maxrate=8000:vbv-bufsize=1200 key-int-max=240 bframes=0 byte-stream=true tune=zerolatency speed-preset=ultrafast
# On arm64 only (0.3.3, ADR 0073 addendum): added to the x264 line's option-string where os.uname() says aarch64, never on
# x86_64, where NEON isn't a CPU x264 knows. asm=NEON leaves out x264's ARMv8-only code (prefetch hints that cost more than
# they save on Graviton3): the same bytes out, about a fifth of x264's CPU (spikes/desk-cpu-levers/README.md).
x264-aarch64 = asm=NEON
caps = video/x-h264,stream-format=byte-stream,profile=constrained-baseline
# config-interval=-1 puts SPS and PPS ahead of every IDR, which is where desk-rtc starts a new viewer.
rtp = mtu=1200 config-interval=-1 aggregate-mode=zero-latency

[audio]
enabled = true
# The null sink's monitor. Sound already reaches a client after the picture, so its buffers stay small (ADR 0037): 5 ms
# fragments (40 ms of room for a stall) and 10 ms Opus frames, 15 ms sooner than 10 ms fragments and 20 ms frames.
capture = pulsesrc device=desk.monitor buffer-time=40000 latency-time=5000 provide-clock=false
encoder = opusenc bitrate=64000 frame-size=10 audio-type=generic
# Sound only while something plays (0.3.3, ADR 0073 addendum): sound is sent only while the desk's sink has a stream (Chromium
# opens one while a page makes sound and closes it about 10 s after; a running AudioContext keeps one), until gate-tail-ms
# after the last one goes. always: send silence all the time, as before 0.3.3.
gate = sink-input
gate-tail-ms = 3000
# sending: a shut gate stops the encoding and sending only; the capture runs as before, so PulseAudio is never touched.
# capture: it stops the capture too (gate-start: restart or hold the null sink, or none), which saves more but left the
# bench's sink and monitor at different rates (44.1 and 48 kHz): not until the image fixes the sink's rate.
gate-stops = sending

# Lever 3 (ADR 0073): when this desk can't hold its frame rate because the machine is busy, step down a ladder and climb back
# when there's room. order = scale: 900, 720 and 540 lines, then quantizer +4, then 30 fps. order = fps (the owner's
# option): 30 fps first at full size, then 900, 720 and 540 lines, then quantizer +4. Never under 30 fps either way.
# Steps apply on top of the level: a level's own max-height and quantizer are the floor they start from.
[adapt]
enabled = true
order = scale
# The desk is starved when its cgroup waited for a CPU this share of the time, in percent, while frames went missing.
pressure-high = 40
pressure-low = 15

# Quality levels (ADR 0039, docs/interfaces/stream-quality.md section 5). desk-rtc sends "level <name>", and desk-stream sets that
# section's values on the running encoder: quantizer, bitrate (the VBV ceiling in kbit/s with pass=qual) and vbv-buf-capacity (ms).
# max-height scales the picture to fit that many lines, aspect kept, even sizes; 0 is the screen's own size.
# Until the first "level" line, [video]'s x264 line runs, so [level.high] matches it. Every level keeps 60 fps and the latency:
# only sharpness and data change. These sections add "videoscale ! capsfilter name=size" after convert, in passthrough at full size.
# stream-capped.conf (ADR 0036) has these levels held to its own picture, so Low stays Low past 100 GB and the rest are the capped
# picture; stream-deep.conf has none, since each would be its own picture. desk-rtc holds the level at Medium or Low there (S-29).

[level.low]
max-height = 720
quantizer = 30
bitrate = 2500
vbv-buf-capacity = 150

[level.medium]
max-height = 0
quantizer = 27
bitrate = 4000
vbv-buf-capacity = 150

[level.high]
max-height = 0
quantizer = 23
bitrate = 8000
vbv-buf-capacity = 150

[level.max]
max-height = 0
quantizer = 19
bitrate = 12000
vbv-buf-capacity = 150
