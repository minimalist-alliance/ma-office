# desk-host (ADR 0072): systemd keeps the io, cpu, memory and pids controllers on at the root, so the desks' cgroup
# (/sys/fs/cgroup/desk-host) can have io.max on every desk (WALL-07, RC-04). Without this systemd turns io off again.
[Manager]
DefaultIOAccounting=yes
DefaultCPUAccounting=yes
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes
