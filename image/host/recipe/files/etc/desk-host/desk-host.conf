# desk-host's settings (image/host/README.md). Host root's. A test host adds its own lines; a member's host takes these.
# DesksPerHost when the instance has no DesksPerHost tag (Platform's launch always sets it, ADR 0072 section 1)
DESKS_PER_HOST=6
# slot-ip: each desk on its slot's own private address (its Elastic IP), port 443. port: the host's address, 4430 + slot.
ADDR_MODE=slot-ip
# The memory rule, per desk (proposed to the Security Analyst, ADR 0072 section 3): swap charged to the desk, compressed in
# its own cap, never written to the swap file.
DESK_SWAP_MAX=2G
DESK_ZSWAP_MAX=1000M
SWAP_FILE=/var/lib/desk-host/swap
SWAP_GB=8
# RC-04: a desk's disk share (0.8 of the EBS baseline / DesksPerHost), split: root reads, root writes, volume reads, volume writes (percent)
IO_SPLIT=40,10,25,25
CT_DESK=4096
CT_HOST=4608
NF_CONNTRACK_MAX=65536
QUOTA_HEAD_MB=1024
QUOTA_HEAD_INODES=50000
# A prepare copies only while the store holds one more root beside what the other slots' desks may still write and this spare
# (desk-host prep_turn; else it refuses, 75)
PREP_SPARE_MB=512
RUNC_VERSION=1.5.2
# deskd's endpoints, {k} the slot (Platform's gateway on a member's host; a test host points them at its fixtures)
DESKD_ENV=
# host ports a desk may reach on its veth (none on a member's host)
HOST_PORTS=
# The host link (desk-host-link, ma-platform contract shared-host.md): Platform's host-api. name for the env the instance's
# Env tag names. Never api.: that sits behind CloudFront, and Platform refuses a host call whose address isn't the host's own. LINK_API (a test host's fake Platform, http://127.0.0.1:<port> only) overrides both; a member's host sets none.
LINK_API_staging=https://host-api.staging.minimalistalliance.com
LINK_API_prod=https://host-api.minimalistalliance.com
# The region each env's API is signed for (SigV4): the API's own, never the instance's. Both host-api. names are REGIONAL API Gateway
# custom domains in us-east-1 only (ma-platform terraform/shared_hosts.tf), so a host in any region signs for us-east-1.
# LINK_API_REGION overrides both for a test fake (with LINK_API) only; a member's host sets none.
LINK_API_REGION_staging=us-east-1
LINK_API_REGION_prod=us-east-1
# Each running slot's metadata stand-in listens on 10.98.<k>.1 at this port; desk-host DNATs the slot's 169.254.169.254:80 to it
STANDIN_PORT=9254
# Prepare every slot with no root, in turn, after the first hello of a boot (1), or leave them to the first start (0)
LINK_PREPARE_EMPTY=1
