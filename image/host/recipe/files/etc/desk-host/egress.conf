# ADR 0036's budgets for each desk on this shared host (ADR 0072 section 8; desk-host's egress.py, one desk-host-egress@<k> per running
# slot). The same keys and values as a desk of its own's /etc/ma/egress.conf, but the interface, which is always the desk's end of its
# veth (eth0 in its network namespace). GB is 10^9 bytes, as the guard counts. A missing or bad value is desk-egress's default, which is
# this file's value. Every rate is multiplied by the slot's class's `egress` (classes.conf). Root only; read at each slot's start.
#
# A test lowers one slot's thresholds in a [slot<k>] section below [egress] (ADR 0036's test 1 on a shared host, row R3) and runs
# `desk-host shaper <k> on`; it holds for whichever desk that slot runs. A member's host has no [slot<k>] section; desk-host-check shaper
# names one if it's there.
[egress]
tick_seconds = 60
# Each class's rate and ceiling. They hold whatever the budgets do.
stream_mbps = 60
root_mbps = 2
other_mbps = 100
# Layer 2: the bucket on 1:15 and 1:20. When it's empty those two classes slow down, and they reopen with reopen_gb back.
bucket_gb = 30
refill_mbps = 1
reopen_gb = 1
slowed_root_mbps = 0.25
slowed_other_mbps = 0.75
# Layers 3 and 4: the stream's profile, on all outbound this UTC month and in the last 24 h. The day lines are on what the last
# 24 h would reach if the stream went deep now (S-29, as on a desk of its own).
capped_month_gb = 100
capped_day_gb = 100
deep_month_gb = 500
deep_day_gb = 105
deep_day_release_gb = 95
# Layer 5: desk-rtc's class, for a broken desk-rtc, on that class's own bytes (S-29).
clamp_day_gb = 135
clamp_day_release_gb = 120
clamped_stream_mbps = 1
