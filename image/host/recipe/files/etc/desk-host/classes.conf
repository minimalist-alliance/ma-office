# desk-host's container size classes (ADR 0072, "Container sizes by tier"). Host root's, read-only to every desk.
# A tier picks a class (Platform's DeskSlot<k> tag, its 6th field); a slot with no class, or an older 2- or 5-field tag, is
# `standard`, which is every slot's share before classes existed, to the byte.
#
# Every value is in units of one standard desk's share of this host. A host holds DesksPerHost units (its launch tag).
#   cpu     cpu.weight, a multiple of 100; 0 is the kernel's cpu.idle: the desk runs only on CPU no other desk wants, and a
#           waking thread of any other desk takes the CPU from it at once. No class has a CPU cap: an idle host gives any desk
#           all it asks for, and only when desks compete does the weight (or cpu.idle) decide who waits.
#   memory  memory.max, a multiple of (MemTotal - 640 MiB) / DesksPerHost. Firm. desk-host refuses a start or a raise that
#           would take the running desks' memory.max past DesksPerHost units, so no desk's peak can reach another's memory.
#   swap    memory.swap.max, a multiple of DESK_SWAP_MAX (desk-host.conf; 2 GiB). The memory rule: what a desk swaps is
#   zswap   compressed inside its own memory.max, at most memory.zswap.max (a multiple of DESK_ZSWAP_MAX, 1,000 MiB), and
#           never written to the swap file (memory.zswap.writeback 0 for every class).
#   disk    io.max on its root and its volume, a multiple of 0.8 of the instance's EBS baseline / DesksPerHost, split by
#           IO_SPLIT. Summed with memory's rule: the running desks never pass DesksPerHost units, so never 0.8 of the baseline.
#   pids    pids.max, a multiple of 8,192.
#   egress  the outbound shaper's rates (ADR 0036, per container: ADR 0072 section 8), a multiple of a desk's (60, 2 and 100 Mbit/s,
#           and the slowed and clamped rates). Published to the desk's /run/desk-host/class.json, and enforced on the slot's veth by
#           its desk-host-egress (egress.py), which reads it each tick, from the bake after 0.1.10. The budgets aren't multiplied.
# Names: a lower-case letter, then lower-case letters, digits or '-', at most 32. Values: decimals (up to 3 places) from 0.01
# to 4; cpu 0, or 0.01 to 10. `standard` must be present and all 1s. desk-host-check's `classes` fails the host on anything
# else, and desk-host then starts no desk.
#
# free, measured (2026-11-09, m7g.xlarge, spikes/host-size-classes/README.md): memory 0.4 is the smallest where a Browser with
# 3 ordinary tabs holds 30 page fps (0.35 thrashes while pages load, 0.30 fails). cpu 0 (cpu.idle): with 2 paid and 10 free
# desks all busy, paid desks held the floor of 6 paid a host at cpu.idle and missed it at cpu.weight 10. No weight keeps that many
# busy free desks moving; Platform runs at most DesksPerHost desks a host at once. disk 0.4 follows memory (admission sums
# both); pids, zswap and egress are half a desk's.
#
# split   (optional 8th column) this class's IO_SPLIT, four percents summing to 100, each at least 1: root reads, root writes, volume
#         reads, volume writes. Without it the class uses desk-host.conf's IO_SPLIT (40,10,25,25). It divides the same `disk` share, so
#         admission (which sums all four byte caps) is unchanged. `free` gives root reads 70%: a cold wake reads its release copies and
#         Chromium through them (spikes/host-wake-counters/README.md: hello 31.5 s -> 23.7 s with the pre-read, Browser ready 52.7 s -> 42.1 s).
#
# class      cpu    memory  swap   zswap  disk   pids   egress  split
standard     1      1       1      1      1      1      1
free         0      0.4     1      0.5    0.4    0.5    0.5     70,5,12.5,12.5
