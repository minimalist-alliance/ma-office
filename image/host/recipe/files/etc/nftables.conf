#!/usr/sbin/nft -f
# The shared host's own ruleset (image/host/, ADR 0072 sections 3 and 13), never the desk's. desk-host adds each slot's
# chains (src_<k>, slot_<k>, ct_<k>, in_<k>, fwdin_<k>, est_<k>, pre_<k>, post_<k>) and jumps to them. Nothing comes in but
# what a desk's own DNAT lets through: nothing new reaches the host's own address, ping included (PF-03); IMDS answers uid 0
# only; a desk's IPv6 is dropped whatever it is (IN-05, WALL-10). Every packet from a desk meets its slot's source check
# (desk_src, src_<k>) before any flow is let through, so a desk can't inject into a neighbour's established flows (IN-09).
# Then every packet of an established flow goes through desk_est, which only counts (est_<k>: out_<k> and rx_<k>, no verdict),
# then takes the same fast-path accept as before: a slot's byte counters see every byte a desk sends and receives, after the
# wall's drops, not each flow's first packet.
flush ruleset
table inet host {
  chain input { type filter hook input priority 0; policy drop;
    iifname "dhv*" meta nfproto ipv6 counter drop
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    iifname "dhv*" jump desk_in
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
  }
  chain desk_in { }
  chain forward { type filter hook forward priority 0; policy drop;
    iifname "dhv*" meta nfproto ipv6 counter drop
    oifname "dhv*" meta nfproto ipv6 counter drop
    iifname "dhv*" jump desk_src
    ct state established,related jump desk_est
    ct state established,related accept
    jump desk_fwd
  }
  chain desk_src { }
  chain desk_est { }
  chain desk_fwd { }
  chain output { type filter hook output priority 0; policy accept;
    ip daddr 169.254.169.254 meta skuid 0 accept
    ip daddr 169.254.169.254 counter reject with icmpx type admin-prohibited
    ip6 daddr fd00:ec2::254 meta skuid 0 accept
    ip6 daddr fd00:ec2::254 counter reject with icmpx type admin-prohibited
  }
}
table ip host_nat {
  chain pre { type nat hook prerouting priority -100; }
  chain post { type nat hook postrouting priority 100; }
}
