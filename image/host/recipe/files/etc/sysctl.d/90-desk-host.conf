# The shared host's (image/host/, ADR 0072). desk-host-check checks each of these.
kernel.yama.ptrace_scope = 2
# WR2-02: no tty line discipline autoloaded by TIOCSETD from a desk (the modules are blacklisted too)
dev.tty.ldisc_autoload = 0
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 0
# IN-11: no core files of a desk's processes on the host
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0
kernel.unprivileged_bpf_disabled = 1
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
# desk-rtc asks for 4 MiB UDP buffers (the desk image's 90-ma.conf); these two are the host's, not a namespace's
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
# The host's own ephemeral ports, above every slot's SNAT block (10000 to 59999, desk-host): under SlotMode=port the host and
# its slots share one address, so the host's own connections (the link, SSM) never take a port a slot's block holds
net.ipv4.ip_local_port_range = 60000 64999
